    // =========================================================================
    // HELPER: KATEX FORMULA RENDERER
    // =========================================================================
    function KatexMath({ text }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !text) return;
        
        // Simple regex to parse $formula$
        const parts = text.split(/(\$[^$]+\$)/g);
        containerRef.current.innerHTML = "";

        parts.forEach(part => {
          if (part.startsWith("$") && part.endsWith("$") && part.length > 2) {
            const math = part.slice(1, -1);
            const span = document.createElement("span");
            try {
              if (window.katex) {
                window.katex.render(math, span, { throwOnError: false });
              } else {
                span.textContent = part;
              }
            } catch (e) {
              span.textContent = part;
            }
            containerRef.current.appendChild(span);
          } else {
            const span = document.createElement("span");
            span.textContent = part;
            containerRef.current.appendChild(span);
          }
        });
      }, [text]);

      return <span ref={containerRef} className="leading-relaxed inline-block" />;
    }

      // =======================================================================

      const triggerViolation = useCallback((reason) => {
        if (!examActive || isSubmitting || examFinishedData) return;

        const maxViolations = appConfig.security.maxViolations || 4;
        const timeStr = new Date().toLocaleTimeString('id-ID');
        const newViol = { time: timeStr, reason };
        
        setViolations(prev => {
          const updated = [...prev, newViol];
          if (loggedStudent) {
            setStudents(stdList => stdList.map(s => {
              if (s.nisn === loggedStudent.nisn) {
                const total = updated.length;
                const lockedNow = total >= maxViolations;
                return {
                  ...s,
                  violations: total,
                  violationsList: updated,
                  isLocked: lockedNow,
                  examStatus: lockedNow ? "Terkunci" : "Sedang Mengerjakan"
                };
              }
              return s;
            }));
          }
          return updated;
        });

        setLastViolationReason(reason);
        setShowViolationModal(true);

        // Suara peringatan beep jika diaktifkan di pengaturan
        if (appConfig.security.enableBeepAlarm) {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } catch (e) {}
        }
      }, [examActive, isSubmitting, examFinishedData, loggedStudent, appConfig.security]);

        const handleBlur = () => {

        // 2. Deteksi Keluar Fullscreen
        const handleFullscreenChange = () => {
          if (appConfig.security.enforceFullscreen && !document.fullscreenElement && !document.webkitFullscreenElement) {
            triggerViolation("Siswa keluar dari mode Layar Penuh (Fullscreen Lock)");
          }
        };

        // 3. Blokir Klik Kanan, Salin, Tempel, dan Shortcut DevTools
        const handleContextMenu = (e) => {
          if (appConfig.security.blockContextMenu) e.preventDefault();
        };
        const handleCopy = (e) => {
          if (appConfig.security.blockCopyPaste) {
            e.preventDefault();
            triggerViolation("Mencoba menyalin (copy) teks naskah");
          }
        };
        const handlePaste = (e) => {
          if (appConfig.security.blockCopyPaste) {
            e.preventDefault();
            triggerViolation("Mencoba menempel (paste) teks");
          }
        };
        const handleKeyDown = (e) => {
          if (!appConfig.security.blockDevTools) return;
          // Blokir F12, Ctrl+U, Ctrl+Shift+I, Alt+Tab warning, F5, Ctrl+R
          if (
            e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || // Ctrl+Shift+I/J/C
            (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 82)) || // Ctrl+U, Ctrl+S, Ctrl+R
            e.keyCode === 116 // F5
          ) {
            e.preventDefault();
            triggerViolation(`Menekan tombol terlarang (${e.key || 'Shortcut'})`);
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);
        document.addEventListener("fullscreenchange", handleFullscreenChange);
        document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
        document.addEventListener("contextmenu", handleContextMenu);
        document.addEventListener("copy", handleCopy);
        document.addEventListener("cut", handleCopy);
        document.addEventListener("paste", handlePaste);
        document.addEventListener("keydown", handleKeyDown);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
          document.removeEventListener("fullscreenchange", handleFullscreenChange);
          document.removeEventListener("webkitfullscreenchange", handleFullscreenChange);
          document.removeEventListener("contextmenu", handleContextMenu);
          document.removeEventListener("copy", handleCopy);
          document.removeEventListener("cut", handleCopy);
          document.removeEventListener("paste", handlePaste);
          document.removeEventListener("keydown", handleKeyDown);
        };
      }, [examActive, triggerViolation]);

      // Timer Ujian Berjalan
      useEffect(() => {
        if (!examActive || timeRemaining <= 0 || isSubmitting) return;

        const interval = setInterval(() => {
          setTimeRemaining(prev => {
            if (prev <= 1) {
              clearInterval(interval);
              finishExam(true); // Waktu Habis -> Otomatis Submit
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [examActive, timeRemaining, isSubmitting]);

      // =======================================================================
      // PENYELESAIAN UJIAN & STAGGERED BATCH SUBMISSION KE GOOGLE DRIVE
      // =======================================================================
      const finishExam = async (forcedByTime = false) => {
        if (isSubmitting) return;
        setIsSubmitting(true);

        // Hitung Skor Siswa Secara Otomatis
        let mcPoints = 0;
        let totalPossible = 0;

        questions.forEach(q => {
          totalPossible += q.points;
          const ans = studentAnswers[q.id];

          if (q.type === "PILIHAN_GANDA" || q.type === "AUDIO_LISTENING" || q.type === "BENAR_SALAH") {
            if (ans === q.correctAnswer) mcPoints += q.points;
          } else if (q.type === "PILIHAN_GANDA_KOMPLEKS") {
            if (Array.isArray(ans) && Array.isArray(q.correctAnswer)) {
              const matchAll = q.correctAnswer.length === ans.length && q.correctAnswer.every(k => ans.includes(k));
              if (matchAll) mcPoints += q.points;
            }
          } else if (q.type === "MENJODOHKAN") {
            if (ans && typeof ans === 'object') {
              let correctPairs = 0;
              q.pairs.forEach((p, idx) => {
                if (ans[idx] === p.correctTarget) correctPairs++;
              });
              mcPoints += Math.round((correctPairs / q.pairs.length) * q.points);
            }
          } else if (q.type === "ESAI") {
            // Simulasi AI Rubric Grading
            if (ans && q.rubric && q.rubric.keywords) {
              const lowerAns = ans.toLowerCase();
              let matchedKeys = 0;
              q.rubric.keywords.forEach(kw => {
                if (lowerAns.includes(kw.toLowerCase())) matchedKeys++;
              });
              const ratio = Math.min(1, matchedKeys / Math.max(3, q.rubric.keywords.length * 0.5));
              mcPoints += Math.round(ratio * q.points);
            }
          }
        });

        const finalScore = Math.min(100, Math.round((mcPoints / (totalPossible || 100)) * 100));

        // Acak Random Staggered Delay (1-5 detik) sesuai ketentuan anti-traffic lock
        const randomDelay = Math.floor(Math.random() * 4) + 1; // 1 s/d 4 detik
        setSubmissionCountdown(randomDelay);

        for (let s = randomDelay; s > 0; s--) {
          setSubmissionCountdown(s);
          await new Promise(r => setTimeout(r, 1000));
        }
        setSubmissionCountdown(0);

        const currentKKM = appConfig.exam.kkm || KKM_DEFAULT;
        const totalDuration = (appConfig.exam.durationMinutes || 60) * 60;
        const durationSec = Math.max(0, totalDuration - timeRemaining);
        const payload = {
          nisn: loggedStudent ? loggedStudent.nisn : "0061234561",
          studentName: loggedStudent ? loggedStudent.name : "Peserta Ujian",
          className: loggedStudent ? loggedStudent.classId : "XII-MIPA-1",
          examTitle: appConfig.exam.examTitle || "Ujian Komprehensif CBT Anti-Kecurangan 2026",
          score: finalScore,
          finalScore: finalScore,
          mcScore: mcPoints,
          essayScore: 0,
          kkm: currentKKM,
          violations: violations,
          violationsCount: violations.length,
          durationSeconds: durationSec,
          durationFormatted: `${Math.floor(durationSec / 60)} menit ${durationSec % 60} detik`,
          userAgent: navigator.userAgent,
          answers: studentAnswers,
          targetFolderId: targetFolderId,
          spreadsheetId: SPREADSHEET_ID_DEFAULT,
          submittedAt: new Date().toISOString()
        };

        // Kirim ke Google Apps Script / Google Spreadsheet secara Real-Time
        let gasSuccess = false;
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              console.log("Submit ujian berhasil disimpan ke Google Spreadsheet:", res);
              showToast("Hasil ujian berhasil disimpan langsung ke Google Spreadsheet!", "success");
            })
            .withFailureHandler((err) => {
              console.error("Gagal simpan hasil ujian ke Spreadsheet:", err);
              showToast("Peringatan sinkronisasi cloud: " + (err.message || err), "error");
            })
            .simpanHasilUjian(payload);
          gasSuccess = true;
        } else if (gasUrl) {
          try {
            await fetch(gasUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "simpanHasilUjian", ...payload })
            });
            gasSuccess = true;
          } catch (e) {
            console.warn("GAS fetch error (offline/CORS), tersimpan lokal:", e);
          }
        }

        // Simpan hasil ke state lokal siswa dan update daftar siswa admin
        const finishData = {
          ...payload,
          gasSuccess: gasSuccess || !gasUrl,
          statusKKM: finalScore >= KKM_DEFAULT ? "TUNTAS" : "BELUM TUNTAS (REMEDIAL)"
        };

        setStudents(prev => prev.map(s => {
          if (loggedStudent && s.nisn === loggedStudent.nisn) {
            return {
              ...s,
              score: finalScore,
              violations: violations.length,
              violationsList: violations,
              examStatus: "Selesai",
              lastActivity: "Baru saja submit"
            };

        setExamActive(false);
        setIsSubmitting(false);

        if (document.fullscreenElement) {

            <div className="bg-gradient-to-r from-cyan-950/40 via-slate-900 to-emerald-950/40 border-t border-slate-800/60 px-4 py-1 text-center text-[11px] text-cyan-300 flex items-center justify-center gap-2">
              <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span><strong>{appConfig.exam.bannerAnnouncement || "UJIAN AKTIF: Penilaian Sumatif Bersama 2026"}</strong></span>
            </div>
          </header>

          {/* ================================================================= */}
          {/* BODY CONTENT: SWITCH ROLE */}
          {/* ================================================================= */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4">
            {role === 'admin' ? (
              <AdminDashboard
                adminTab={adminTab}
                setAdminTab={setAdminTab}
                classes={classes}
                setClasses={setClasses}
                students={students}
                setStudents={setStudents}
                questions={questions}
                setQuestions={setQuestions}
                revisions={revisions}
                setRevisions={setRevisions}
                targetFolderId={targetFolderId}
                setTargetFolderId={setTargetFolderId}
                gasUrl={gasUrl}
                setGasUrl={setGasUrl}
                gasSyncStatus={gasSyncStatus}
                testGasConnection={testGasConnection}
                isSyncingGas={isSyncingGas}
                appConfig={appConfig}
                setAppConfig={setAppConfig}
                handleSaveConfigToGAS={handleSaveConfigToGAS}
                handleForceSyncAll={handleForceSyncAll}
                handleSetupDatabase={handleSetupDatabase}
                handlePullDataFromSpreadsheet={handlePullDataFromSpreadsheet}
                setShowChangePasswordModal={setShowChangePasswordModal}
                showToast={showToast}
              />
            ) : (
              <StudentExamPortal
                students={students}
                setStudents={setStudents}
                questions={questions}
                loggedStudent={loggedStudent}
                setLoggedStudent={setLoggedStudent}
                examActive={examActive}
                setExamActive={setExamActive}
                currentQuestionIndex={currentQuestionIndex}
                setCurrentQuestionIndex={setCurrentQuestionIndex}
                studentAnswers={studentAnswers}
                setStudentAnswers={setStudentAnswers}
                doubtfulAnswers={doubtfulAnswers}
                setDoubtfulAnswers={setDoubtfulAnswers}
                timeRemaining={timeRemaining}
                setTimeRemaining={setTimeRemaining}
                violations={violations}
                setViolations={setViolations}
                audioPlays={audioPlays}
                setAudioPlays={setAudioPlays}
                finishExam={finishExam}
                isSubmitting={isSubmitting}
                submissionCountdown={submissionCountdown}
                examFinishedData={examFinishedData}
                setExamFinishedData={setExamFinishedData}
                appConfig={appConfig}
                setShowAdminAuthModal={setShowAdminAuthModal}
                setShowChangePasswordModal={setShowChangePasswordModal}
                setRole={setRole}
                setAdminAuthenticated={setAdminAuthenticated}
                showToast={showToast}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="no-print bg-slate-900 border-t border-slate-800 py-3 text-center text-xs text-slate-500">
            GusthyPalinPatandaExam Engine &copy; 2026 • Google Drive Auto-Save Sync (Folder: {targetFolderId}) • Didesain Khusus Anti-Lag & Anti-Kecurangan
          </footer>
        </div>
      );
    }

    // =========================================================================
    // MODUL 1: ADMIN DASHBOARD UTAMA & MANAJEMEN PENGGUNA
    // =========================================================================
    function AdminDashboard({
      adminTab, setAdminTab,
      classes, setClasses,
      students, setStudents,
      questions, setQuestions,
      revisions, setRevisions,
      targetFolderId, setTargetFolderId,
      gasUrl, setGasUrl,
      gasSyncStatus, testGasConnection, isSyncingGas,
      appConfig, setAppConfig,
      handleSaveConfigToGAS,
      handleForceSyncAll,
      handleSetupDatabase,
      handlePullDataFromSpreadsheet,
      setShowChangePasswordModal,
      showToast
    }) {
      // Filter State Siswa
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedClassFilter, setSelectedClassFilter] = useState("ALL");
      const [onlyActiveClasses, setOnlyActiveClasses] = useState(false);
      const [selectedStudentIds, setSelectedStudentIds] = useState([]);

      // Modal Siswa Baru (Tunggal & Massal)
      const [showAddStudentModal, setShowAddStudentModal] = useState(false);
      const [studentModalTab, setStudentModalTab] = useState("single"); // "single" | "bulk"
      const [newStudentForm, setNewStudentForm] = useState({ name: "", nisn: "", classId: classes[0]?.id || "X-1" });
      const [bulkAddClassId, setBulkAddClassId] = useState(classes[0]?.id || "X-1");
      const [bulkAddNamesText, setBulkAddNamesText] = useState("");

      // Modal Edit Massal
      const [showBulkEditModal, setShowBulkEditModal] = useState(false);
      const [bulkEditClassFilter, setBulkEditClassFilter] = useState("ALL");
      const [bulkEditMode, setBulkEditMode] = useState("text"); // "text" | "table"
      const [bulkEditStudentsList, setBulkEditStudentsList] = useState([]);
      const [bulkEditTextNames, setBulkEditTextNames] = useState("");
      const [bulkChangeClassTarget, setBulkChangeClassTarget] = useState(classes[0]?.id || "X-1");

      // Modal Edit Tunggal
      const [showEditSingleModal, setShowEditSingleModal] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);

      // Modal Hapus Massal
      const [showBulkDeleteModal, setShowBulkDeleteModal] = useState(false);
      const [bulkDeleteTarget, setBulkDeleteTarget] = useState("selected"); // "selected" | "class" | "all"
      const [bulkDeleteClassId, setBulkDeleteClassId] = useState(classes[0]?.id || "X-1");
      const [deleteConfirmationText, setDeleteConfirmationText] = useState("");

      // Helper Sinkronisasi ke Google Spreadsheet sheet Data_Siswa
      const syncStudentsWithGAS = (updatedList, toastMsg) => {
        setStudents(updatedList);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              if (toastMsg) showToast(toastMsg, "success");
            })
            .withFailureHandler((err) => {
              showToast("Peringatan: Gagal sinkron ke Google Spreadsheet: " + (err.message || err), "error");
            })
            .simpanDataSiswa(updatedList);
        } else if (toastMsg) {
          showToast(toastMsg, "success");
        }
      };

      // Helper Generator NISN 10-Digit Unik
      const generateUniqueNisn = (existingSet) => {
        let candidate;
        let attempts = 0;
        do {
          const rand = Math.floor(10000000 + Math.random() * 90000000); // 8 digit acak
          candidate = "00" + rand;
          attempts++;
        } while (existingSet.has(candidate) && attempts < 1000);
        existingSet.add(candidate);
        return candidate;
      };

      // Hitung Metrik Dashboard
      const totalStudents = students.length;
      const completedExams = students.filter(s => s.examStatus === "Selesai").length;
      const lockedStudents = students.filter(s => s.isLocked).length;
      const avgScore = totalStudents > 0 
        ? Math.round(students.reduce((acc, curr) => acc + (curr.score || 0), 0) / Math.max(1, students.filter(s => s.score > 0).length))
        : 0;

      // Filter Siswa Berdasarkan Input
      const filteredStudents = useMemo(() => {
        return students.filter(std => {
          const matchSearch = std.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              std.nisn.includes(searchQuery) ||
                              std.classId.toLowerCase().includes(searchQuery.toLowerCase());
          const matchClass = selectedClassFilter === "ALL" || std.classId === selectedClassFilter;
          const classObj = classes.find(c => c.id === std.classId);
          const matchActive = !onlyActiveClasses || (classObj && classObj.active);
          return matchSearch && matchClass && matchActive;
        });
      }, [students, searchQuery, selectedClassFilter, onlyActiveClasses, classes]);

      // Bulk Select All
      const toggleSelectAll = () => {
        if (selectedStudentIds.length === filteredStudents.length) {
          setSelectedStudentIds([]);
        } else {
          setSelectedStudentIds(filteredStudents.map(s => s.id));
        }
      };

      const toggleSelectOne = (id) => {
        setSelectedStudentIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      // Bulk Reset Login
      const handleBulkResetLogin = () => {
        if (selectedStudentIds.length === 0) return;
        const updated = students.map(s => selectedStudentIds.includes(s.id) ? { ...s, isLocked: false, violations: 0 } : s);
        syncStudentsWithGAS(updated, `Berhasil mereset login untuk ${selectedStudentIds.length} siswa!`);
        setSelectedStudentIds([]);
      };

      // Bulk Delete Terpilih
      const handleBulkDelete = () => {
        if (selectedStudentIds.length === 0) return;
        if (!confirm(`Hapus ${selectedStudentIds.length} siswa yang dipilih secara permanen?`)) return;
        const remaining = students.filter(s => !selectedStudentIds.includes(s.id));
        syncStudentsWithGAS(remaining, `Daftar ${selectedStudentIds.length} siswa terpilih telah dihapus.`);
        setSelectedStudentIds([]);
      };

      // Tambah Siswa Tunggal
      const handleAddStudentSubmit = (e) => {
        e.preventDefault();
        if (!newStudentForm.name || !newStudentForm.nisn) {
          showToast("Nama dan NISN wajib diisi!", "error");
          return;
        }
        const newEntry = {
          id: "S" + (Date.now().toString().slice(-4)),
          nisn: newStudentForm.nisn.trim(),
          name: newStudentForm.name.trim(),
          classId: newStudentForm.classId,
          username: newStudentForm.name.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8) || "siswa" + newStudentForm.nisn.slice(-3),
          token: `GPP-${newStudentForm.classId}-${newStudentForm.nisn.trim().slice(-3)}`,
          isLocked: false,
          examStatus: "Belum Mulai",
          score: 0,
          violations: 0,
          violationsList: [],
          lastActivity: "-"
        };
        const updated = [newEntry, ...students];
        syncStudentsWithGAS(updated, "Siswa baru berhasil ditambahkan!");
        setShowAddStudentModal(false);
        setNewStudentForm({ name: "", nisn: "", classId: classes[0]?.id || "X-1" });
      };

      // Tambah Siswa Massal (HANYA NAMA)
      const handleBulkAddSubmit = (e) => {
        if (e) e.preventDefault();
        const rawLines = bulkAddNamesText
          .split(/\r?\n/)
          .map(line => line.trim().replace(/^[\d\.\-\)\*]+\s*/, "")) // Bersihkan nomor urut (1. Nama, 2) Nama, - Nama)
          .filter(line => line.length > 0);

        if (rawLines.length === 0) {
          showToast("Daftar nama siswa masih kosong! Masukkan minimal 1 nama siswa.", "error");
          return;
        }

        const existingNisns = new Set(students.map(s => String(s.nisn)));
        const targetClass = bulkAddClassId || classes[0]?.id || "X-1";
        const timestamp = Date.now().toString().slice(-4);

        const newEntries = rawLines.map((name, index) => {
          const nisn = generateUniqueNisn(existingNisns);
          const cleanUser = name.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 10) || ("siswa" + nisn.slice(-4));
          return {
            id: "S" + timestamp + "_" + (index + 1),
            nisn: nisn,
            name: name,
            classId: targetClass,
            username: cleanUser,
            token: `GPP-${targetClass}-${nisn.slice(-3)}`,
            isLocked: false,
            examStatus: "Belum Mulai",
            score: 0,
            violations: 0,
            violationsList: [],
            lastActivity: "-"
          };
        });

        const merged = [...newEntries, ...students];
        syncStudentsWithGAS(merged, `Berhasil menambahkan ${newEntries.length} siswa baru ke rombel ${targetClass}!`);
        setBulkAddNamesText("");
        setShowAddStudentModal(false);
      };

      // Buka Modal Edit Massal
      const handleOpenBulkEdit = () => {
        let targetStudents = [];
        let filterVal = "ALL";
        if (selectedStudentIds.length > 0) {
          targetStudents = students.filter(s => selectedStudentIds.includes(s.id));
          filterVal = "SELECTED";
        } else if (selectedClassFilter !== "ALL") {
          targetStudents = students.filter(s => s.classId === selectedClassFilter);
          filterVal = selectedClassFilter;
        } else {
          targetStudents = [...students];
          filterVal = "ALL";
        }

        setBulkEditClassFilter(filterVal);
        setBulkEditStudentsList(targetStudents.map(s => ({ ...s })));
        setBulkEditTextNames(targetStudents.map(s => s.name).join("\n"));
        setShowBulkEditModal(true);
      };

      // Saat filter di Modal Edit Massal diubah
      const handleBulkEditFilterChange = (filterVal) => {
        setBulkEditClassFilter(filterVal);
        let target = [];
        if (filterVal === "SELECTED") {
          target = students.filter(s => selectedStudentIds.includes(s.id));
        } else if (filterVal === "ALL") {
          target = [...students];
        } else {
          target = students.filter(s => s.classId === filterVal);
        }
        setBulkEditStudentsList(target.map(s => ({ ...s })));
        setBulkEditTextNames(target.map(s => s.name).join("\n"));
      };

      // Simpan Perubahan Edit Massal (Mode Tabel)
      const handleSaveBulkEditTable = () => {
        const editMap = new Map();
        bulkEditStudentsList.forEach(s => {
          editMap.set(s.id, s);
        });

        const updated = students.map(s => {
          if (editMap.has(s.id)) {
            const edited = editMap.get(s.id);
            const finalClass = edited.classId || s.classId;
            const finalNisn = (edited.nisn || s.nisn).trim();
            return {
              ...s,
              name: (edited.name || s.name).trim(),
              nisn: finalNisn,
              classId: finalClass,
              token: `GPP-${finalClass}-${finalNisn.slice(-3)}`
            };
          }
          return s;
        });

        syncStudentsWithGAS(updated, `Berhasil memperbarui ${bulkEditStudentsList.length} data siswa!`);
        setShowBulkEditModal(false);
      };

      // Simpan Perubahan Edit Massal (Mode Teks - Hanya Nama)
      const handleSaveBulkEditText = () => {
        const lines = bulkEditTextNames
          .split(/\r?\n/)
          .map(l => l.trim().replace(/^[\d\.\-\)\*]+\s*/, ""))
          .filter(l => l.length > 0);

        if (lines.length === 0) {
          showToast("Daftar nama tidak boleh kosong!", "error");
          return;
        }

        const targetList = [...bulkEditStudentsList];
        const existingNisns = new Set(students.map(s => String(s.nisn)));
        const targetClass = bulkEditClassFilter === "ALL" || bulkEditClassFilter === "SELECTED"
          ? (classes[0]?.id || "X-1")
          : bulkEditClassFilter;

        const updatedMap = new Map();
        const newlyAdded = [];

        lines.forEach((name, idx) => {
          if (idx < targetList.length) {
            const existing = targetList[idx];
            updatedMap.set(existing.id, {
              ...existing,
              name: name
            });
          } else {
            const newNisn = generateUniqueNisn(existingNisns);
            newlyAdded.push({
              id: "S" + Date.now().toString().slice(-4) + "_" + (idx + 1),
              nisn: newNisn,
              name: name,
              classId: targetClass,
              username: name.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 10) || ("siswa" + newNisn.slice(-4)),
              token: `GPP-${targetClass}-${newNisn.slice(-3)}`,
              isLocked: false,
              examStatus: "Belum Mulai",
              score: 0,
              violations: 0,
              violationsList: [],
              lastActivity: "-"
            });
          }
        });

        let updatedAll = students.map(s => {
          if (updatedMap.has(s.id)) {
            return updatedMap.get(s.id);
          }
          return s;
        });

        if (newlyAdded.length > 0) {
          updatedAll = [...newlyAdded, ...updatedAll];
        }

        syncStudentsWithGAS(updatedAll, `Berhasil memperbarui ${lines.length} nama siswa!`);
        setShowBulkEditModal(false);
      };

      // Terapkan perubahan kelas serentak pada daftar edit massal
      const handleApplyBulkChangeClass = () => {
        if (!bulkChangeClassTarget) return;
        setBulkEditStudentsList(prev => prev.map(s => ({
          ...s,
          classId: bulkChangeClassTarget
        })));
        showToast(`Kelas seluruh siswa di daftar diset ke ${bulkChangeClassTarget}`, "success");
      };

      // Simpan Edit Siswa Individual
      const handleSaveEditSingleStudent = (e) => {
        e.preventDefault();
        if (!editingStudent) return;
        if (!editingStudent.name || !editingStudent.nisn) {
          showToast("Nama dan NISN wajib diisi!", "error");
          return;
        }

        const finalClass = editingStudent.classId;
        const finalNisn = editingStudent.nisn.trim();
        const updated = students.map(s => {
          if (s.id === editingStudent.id) {
            return {
              ...editingStudent,
              name: editingStudent.name.trim(),
              nisn: finalNisn,
              classId: finalClass,
              token: editingStudent.token || `GPP-${finalClass}-${finalNisn.slice(-3)}`
            };
          }
          return s;
        });

        syncStudentsWithGAS(updated, `Data siswa ${editingStudent.name} berhasil diperbarui!`);
        setShowEditSingleModal(false);
        setEditingStudent(null);
      };

      // Eksekusi Hapus Massal
      const handleExecuteBulkDelete = () => {
        let remaining = [];
        let deletedCount = 0;

        if (bulkDeleteTarget === "selected") {
          if (selectedStudentIds.length === 0) {
            showToast("Tidak ada siswa yang dipilih!", "error");
            return;
          }
          if (!confirm(`Hapus ${selectedStudentIds.length} siswa terpilih secara permanen?`)) return;
          deletedCount = selectedStudentIds.length;
          remaining = students.filter(s => !selectedStudentIds.includes(s.id));
          setSelectedStudentIds([]);
        } else if (bulkDeleteTarget === "class") {
          const countInClass = students.filter(s => s.classId === bulkDeleteClassId).length;
          if (countInClass === 0) {
            showToast(`Tidak ada siswa di rombel ${bulkDeleteClassId}.`, "error");
            return;
          }
          if (!confirm(`Hapus seluruh ${countInClass} siswa di rombel ${bulkDeleteClassId}?`)) return;
          deletedCount = countInClass;
          remaining = students.filter(s => s.classId !== bulkDeleteClassId);
          setSelectedStudentIds(prev => prev.filter(id => remaining.some(r => r.id === id)));
        } else if (bulkDeleteTarget === "all") {
          if (deleteConfirmationText.trim() !== "HAPUS") {
            showToast("Ketik kata 'HAPUS' dengan huruf besar untuk konfirmasi pengosongan total!", "error");
            return;
          }
          if (!confirm(`PERINGATAN: Seluruh ${students.length} siswa akan dihapus permanen. Lanjutkan?`)) return;
          deletedCount = students.length;
          remaining = [];
          setSelectedStudentIds([]);
        }

        syncStudentsWithGAS(remaining, `Sukses menghapus ${deletedCount} data siswa.`);
        setShowBulkDeleteModal(false);
        setDeleteConfirmationText("");
      };

      // Reset Single Student Emergency
      const emergencyReset = (nisn) => {
        setStudents(prev => prev.map(s => s.nisn === nisn ? { ...s, isLocked: false, violations: 0, examStatus: "Sedang Mengerjakan" } : s));
        showToast(`Login siswa NISN ${nisn} berhasil dibuka darurat!`, "success");
      };

      // Download Template Excel
      const downloadExcelTemplate = () => {
        if (!window.XLSX) {
          showToast("SheetJS belum siap", "error");
          return;
        }
        const wsData = [
          ["NISN", "NAMA_LENGKAP", "KELAS_ROMBEL"],
          ["0061234590", "Contoh Siswa Baru 1", "XII-MIPA-1"],
          ["0061234591", "Contoh Siswa Baru 2", "XI-IPA-1"]
        ];
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Template_Siswa");
        XLSX.writeFile(wb, "Template_Import_Siswa_GPP.xlsx");
        showToast("Template Excel resmi berhasil diunduh!", "success");
      };

      // Import Excel Siswa
      const handleExcelImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            if (rows.length <= 1) {
              showToast("File Excel tidak memiliki data baris!", "error");
              return;
            }

            const importedStudents = [];
            for (let i = 1; i < rows.length; i++) {
              const [nisn, name, classId] = rows[i];
              if (nisn && name) {
                importedStudents.push({
                  id: "IMP-" + (Date.now().toString().slice(-4)) + i,
                  nisn: String(nisn),
                  name: String(name),
                  classId: String(classId || "X-1"),
                  username: String(name).toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8),
                  token: `GPP-${classId || 'X'}-${String(nisn).slice(-3)}`,
                  isLocked: false,
                  examStatus: "Belum Mulai",
                  score: 0,
                  violations: 0,
                  violationsList: [],
                  lastActivity: "-"
                });
              }
            }

            const mergedStudents = [...importedStudents, ...students];
            setStudents(mergedStudents);
            showToast(`Berhasil mengimpor ${importedStudents.length} data siswa dari Excel!`, "success");

            // Otomatis sinkronkan ke Google Spreadsheet sheet Data_Siswa
            if (typeof google !== 'undefined' && google.script && google.script.run) {
              google.script.run
                .withSuccessHandler((res) => {
                  showToast(`Sukses! ${importedStudents.length} data siswa tersimpan di Google Spreadsheet.`, "success");
                })
                .withFailureHandler((err) => {
                  showToast("Gagal menyimpan ke Spreadsheet: " + (err.message || err), "error");
                })
                .simpanDataSiswa(mergedStudents);
            }
          } catch (err) {
            showToast("Gagal membaca file Excel: " + err.message, "error");
          }
        };
        reader.readAsArrayBuffer(file);
      };

      return (
        <div className="space-y-6">
          {/* TAB NAVIGATION ADMIN */}
          <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
            <div className="flex flex-wrap gap-1.5 text-xs font-semibold">
              {[
                { id: "dashboard", label: "Dashboard Ringkasan", icon: Icons.Dashboard },
                { id: "students", label: "Manajemen Siswa", icon: Icons.Users },
                { id: "questions", label: "Bank Soal Multi-Tipe", icon: Icons.BookOpen },
                { id: "duckrace", label: "Duck Race Live", icon: Icons.Duck },
                { id: "barcodes", label: "Cetak Kartu Ujian", icon: Icons.Barcode },
                { id: "analytics", label: "Analisis Butir Soal AI", icon: Icons.Brain },
                { id: "settings", label: "Koneksi Google Drive", icon: Icons.Cloud },
              ].map(tab => {
                const IconComponent = tab.icon;
                const isActive = adminTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setAdminTab(tab.id)}
                    className={`px-3 py-2 rounded-xl transition flex items-center gap-2 ${
                      isActive
                        ? "bg-slate-800 text-cyan-400 border border-cyan-500/40 shadow-sm shadow-cyan-500/10"
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/40"
                    }`}
                  >
                    <IconComponent />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </div>

            {/* Quick Emergency Button */}
            <button
              onClick={() => {
                const locked = students.filter(s => s.isLocked);
                if (locked.length === 0) {
                  showToast("Tidak ada siswa yang berstatus terkunci saat ini.", "success");
                } else {
                  setStudents(prev => prev.map(s => ({ ...s, isLocked: false, violations: 0 })));
                  showToast(`Emergency: Berhasil mereset seluruh ${locked.length} siswa terkunci!`, "success");
                }
              }}
              className="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/40 rounded-xl text-xs font-bold flex items-center gap-1.5 transition"
            >
              <Icons.Unlock />
              <span>Darurat Reset Siswa Terkunci</span>
            </button>
          </div>

                    </button>

                    {/* Tombol Uji Koneksi */}
                    {gasUrl && (
                      <button
                        onClick={testGasConnection}
                        disabled={isSyncingGas}
                        className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 rounded-xl font-medium transition"
                      >
                        Ping URL
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // MODUL 2: BANK SOAL, FILTER KATEGORI, REVISI & EKSPOR
    // =========================================================================
    function QuestionBankModule({ questions, setQuestions, revisions, setRevisions, showToast }) {
      const [filterCategory, setFilterCategory] = useState("SEMUA");
      const [showCategoryDropdown, setShowCategoryDropdown] = useState(false);
      const [showRevisionModal, setShowRevisionModal] = useState(false);
      const [showAddQuestionModal, setShowAddQuestionModal] = useState(false);
      const [selectedQuestionForRevision, setSelectedQuestionForRevision] = useState(null);
      const [newQForm, setNewQForm] = useState({
        type: "PILIHAN_GANDA",
        category: "Umum",
        question: "",
        optA: "",
        optB: "",
        optC: "",
        optD: "",
        correctAnswer: "A",
        points: 10
      });

      // Simpan Bank Soal ke Spreadsheet via google.script.run
      const handleSaveBankSoalToGAS = (customList) => {
        const listToSave = customList || questions;
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          showToast("Menyimpan Bank Soal ke Google Spreadsheet...", "success");
          google.script.run
            .withSuccessHandler((res) => {
              showToast(`Bank Soal (${listToSave.length} butir) berhasil tersimpan di Google Spreadsheet!`, "success");
            })
            .withFailureHandler((err) => {
              showToast("Gagal menyimpan bank soal ke Spreadsheet: " + (err.message || err), "error");
            })
            .simpanBankSoal(listToSave);
        } else {
          showToast("Bank Soal tersimpan di penyimpanan browser lokal.", "success");
        }
      };

      // Tambah Soal Baru
      const handleAddQuestionSubmit = (e) => {
        e.preventDefault();
        if (!newQForm.question.trim()) {
          showToast("Teks soal tidak boleh kosong!", "error");
          return;
        }

        const newQ = {
          id: "Q" + (questions.length + 1),
          number: questions.length + 1,
          type: newQForm.type,
          category: newQForm.category,
          question: newQForm.question,
          options: (newQForm.type === "PILIHAN_GANDA" || newQForm.type === "PILIHAN_GANDA_KOMPLEKS" || newQForm.type === "AUDIO_LISTENING") ? [
            { key: "A", text: newQForm.optA || "Pilihan A" },
            { key: "B", text: newQForm.optB || "Pilihan B" },
            { key: "C", text: newQForm.optC || "Pilihan C" },
            { key: "D", text: newQForm.optD || "Pilihan D" }
          ] : null,
          correctAnswer: newQForm.correctAnswer || "A",
          points: Number(newQForm.points) || 10,
          explanation: "Soal dibuat via Admin CBT"
        };

        const updatedQuestions = [...questions, newQ];
        setQuestions(updatedQuestions);
        setShowAddQuestionModal(false);
        setNewQForm({
          type: "PILIHAN_GANDA",
          category: "Umum",
          question: "",
          optA: "",
          optB: "",
          optC: "",
          optD: "",
          correctAnswer: "A",
          points: 10
        });
        showToast("Soal baru berhasil ditambahkan!", "success");

        // Otomatis simpan ke Google Spreadsheet
        handleSaveBankSoalToGAS(updatedQuestions);
      };

      // Filter Soal
      const filteredQuestions = useMemo(() => {
        if (filterCategory === "SEMUA") return questions;
        return questions.filter(q => q.category.toLowerCase().includes(filterCategory.toLowerCase()) || q.type === filterCategory);
      }, [questions, filterCategory]);

      // Rollback Revisi Soal
      const handleRollback = (rev) => {
        const updatedList = questions.map(q => {
          if (q.id === rev.questionId) {
            return {
              ...q,
              question: rev.prevQuestion,
              options: rev.prevOptions ? rev.prevOptions.map((opt, i) => ({ key: String.fromCharCode(65 + i), text: opt })) : q.options
            };
          }
          return q;
        });
        setQuestions(updatedList);
        showToast(`Soal ${rev.questionId} berhasil di-rollback ke versi sebelumnya!`, "success");
        setShowRevisionModal(false);
        handleSaveBankSoalToGAS(updatedList);
      };

      // Ekspor Dokumen Word (.doc) Ber-Kop Surat Resmi
      const exportToWord = (includeKey = false) => {
        const headerHtml = `
          <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
          <head><meta charset='utf-8'><title>Naskah Soal Ujian</title>
          <style>
            body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; color: #000; }
            .kop { text-align: center; border-bottom: 3px double #000; padding-bottom: 10px; margin-bottom: 20px; }
            .soal-box { margin-bottom: 15px; page-break-inside: avoid; }
            .kunci { color: #047857; font-weight: bold; background: #ecfdf5; padding: 2px 6px; }
          </style>
          </head>
          <body>
            <div class='kop'>
              <h3 style='margin:0;'>PEMERINTAH PROVINSI KALIMANTAN UTARA</h3>
              <h2 style='margin:0;'>SMAN 1 SEBATIK • SISTEM GUSTHYPALINPATANDAEXAM</h2>
              <p style='margin:0; font-size:10pt;'>Naskah Ujian Sumatif Komprehensif Semester Berbasis CBT Anti-Kecurangan</p>
            </div>
            <h4 style='text-align:center;'>LEMBAR SOAL UJIAN ONLINE</h4>
        `;

        let bodyHtml = "";
        questions.forEach((q, idx) => {
          bodyHtml += `
            <div class='soal-box'>
              <p><strong>${idx + 1}. [${q.category} - Bobot: ${q.points} Poin]</strong><br/>${q.question.replace(/\$/g, "")}</p>
          `;
          if (q.options) {
            bodyHtml += "<div style='margin-left: 20px;'>";
            q.options.forEach(opt => {
              bodyHtml += `<p style='margin: 3px 0;'><strong>${opt.key}.</strong> ${opt.text}</p>`;
            });
            bodyHtml += "</div>";
          }
          if (q.pairs) {
            bodyHtml += "<table border='1' cellpadding='4' style='border-collapse:collapse; margin-left:20px;'>";
            q.pairs.forEach(p => {
              bodyHtml += `<tr><td>${p.premise}</td><td>➔</td><td>${includeKey ? p.correctTarget : '........................'}</td></tr>`;
            });
            bodyHtml += "</table>";
          }
          if (includeKey && q.correctAnswer) {
            bodyHtml += `<p class='kunci'>Kunci Jawaban: ${Array.isArray(q.correctAnswer) ? q.correctAnswer.join(", ") : q.correctAnswer}</p>`;
          }
          bodyHtml += "</div>";
        });

        const footerHtml = "</body></html>";
        const fullContent = headerHtml + bodyHtml + footerHtml;

        const blob = new Blob(['\ufeff' + fullContent], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Naskah_Soal_GPP_${includeKey ? "Dengan_Kunci" : "Siswa"}.doc`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Naskah Word (.doc) berhasil diunduh!", "success");
      };

      // Ekspor Rekap Excel Bank Soal
      const exportQuestionsToExcel = () => {
        if (!window.XLSX) return;
        const rows = [
          ["ID_SOAL", "NOMOR", "TIPE", "KATEGORI", "BOBOT", "TEKS_SOAL", "KUNCI_JAWABAN", "PENJELASAN"]
        ];
        questions.forEach(q => {
          rows.push([
            q.id,
            q.number,
            q.type,
            q.category,
            q.points,
            q.question,
            Array.isArray(q.correctAnswer) ? q.correctAnswer.join(", ") : (q.correctAnswer || "-"),
            q.explanation || "-"
          ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Bank_Soal");
        XLSX.writeFile(wb, "Bank_Soal_GusthyPalinPatandaExam.xlsx");
        showToast("Bank Soal Excel berhasil diekspor!", "success");
      };

      return (
        <div className="space-y-4">
          {/* TOOLBAR BANK SOAL */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
            {/* Filter Kategori Dropdown / Button */}
            <div className="relative">
              <button
                onClick={() => setShowCategoryDropdown(!showCategoryDropdown)}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/40 rounded-xl text-xs font-bold flex items-center gap-2 transition"
              >
                <Icons.Filter />
                <span>Filter Kategori: [{filterCategory}]</span>
              </button>

              {showCategoryDropdown && (
                <div className="absolute left-0 mt-2 w-52 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-30 p-1 space-y-0.5 text-xs">
                  {["SEMUA", "Pilihan Ganda", "Pilihan Ganda Kompleks", "Menjodohkan", "Benar / Salah", "Essay"].map(cat => (
                    <button
                      key={cat}
                      onClick={() => { setFilterCategory(cat); setShowCategoryDropdown(false); }}
                      className={`w-full text-left px-3 py-2 rounded-lg font-medium transition ${
                        filterCategory === cat ? "bg-cyan-500 text-slate-950 font-bold" : "text-slate-300 hover:bg-slate-800"
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Tombol Aksi & Ekspor Options */}
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setShowAddQuestionModal(true)}
                className="px-3 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1.5 transition shadow-sm shadow-cyan-500/20"
              >
                <Icons.Plus />
                <span>Tambah Soal Baru</span>
              </button>

              <button
                onClick={() => setShowUploadModal(true)}
                className="px-3 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1.5 transition shadow-sm shadow-emerald-500/20"
                title="Unggah berkas soal dari Word (.doc/.docx), PDF (.pdf), Excel (.xlsx/.xls), atau Plain Text (.txt)"
              >
                <Icons.Upload />
                <span>Upload Soal (Word / PDF / Excel / Text)</span>
              </button>

              <button
                onClick={() => handleSaveBankSoalToGAS()}
                className="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
                title="Simpan seluruh butir soal ke Google Spreadsheet sheet Bank_Soal"
              >
                <Icons.Cloud />
                <span>Simpan ke Spreadsheet</span>
              </button>

              <button
                onClick={() => setShowRevisionModal(true)}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
              >
                <Icons.Clock />
                <span>Riwayat Revisi ({revisions.length})</span>
              </button>

              <button
                onClick={() => exportToWord(false)}
                className="px-3 py-2 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/40 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
              >
                <Icons.FileText />
                <span>Ekspor Word (.doc)</span>
              </button>

              <button
                onClick={() => exportToWord(true)}
                className="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
              >
                <Icons.CheckCircle />
                <span>Word + Kunci</span>
              </button>

              <button
                onClick={exportQuestionsToExcel}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
              >
                <Icons.Download />
                <span>Ekspor Excel (.xlsx)</span>
              </button>
            </div>
          </div>

          {/* DAFTAR BUTIR SOAL */}
          <div className="space-y-4">
            {filteredQuestions.map((q, idx) => (
              <div key={q.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-400 font-bold flex items-center justify-center text-xs">
                      #{q.number}
                    </span>
                    <span className="px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 text-[11px] font-semibold">
                      {q.category}
                    </span>
                    {q.type === "AUDIO_LISTENING" && (
                      <span className="px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 text-[11px] font-semibold flex items-center gap-1">
                        <Icons.Volume2 /> Audio Listening
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2 text-xs">
                    <span className="text-slate-400">Bobot: <strong className="text-cyan-400">{q.points} Poin</strong></span>
                  </div>
                </div>

                {/* Question Text with KaTeX */}
                <div className="text-sm text-slate-200 font-medium">
                  <KatexMath text={q.question} />
                </div>

                {/* Audio Listening Player Simulation */}
                {q.audioUrl && (
                  <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center gap-3 text-xs">
                    <div className="p-2 rounded-lg bg-amber-500/20 text-amber-400">
                      <Icons.Volume2 />
                    </div>
                    <div>
                      <p className="font-semibold text-white">Audio Rekaman Listening</p>
                      <p className="text-[11px] text-slate-400">Batas putar: Maksimal {q.audioMaxPlays || 2} kali per peserta</p>
                    </div>
                  </div>
                )}

                {/* Multiple Choice Options */}
                {q.options && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs pt-1">
                    {q.options.map(opt => {
                      const isCorrect = Array.isArray(q.correctAnswer)
                        ? q.correctAnswer.includes(opt.key)
                        : q.correctAnswer === opt.key;
                      return (
                        <div
                          key={opt.key}
                          className={`p-2.5 rounded-xl border flex items-start gap-2.5 ${
                            isCorrect
                              ? "bg-emerald-950/40 border-emerald-500/50 text-emerald-200"
                              : "bg-slate-950/60 border-slate-800 text-slate-300"
                          }`}
                        >
                          <span className={`w-5 h-5 rounded flex items-center justify-center font-bold text-[11px] ${
                            isCorrect ? "bg-emerald-500 text-slate-950" : "bg-slate-800 text-slate-400"
                          }`}>
                            {opt.key}
                          </span>
                          <span className="flex-1 mt-0.5">{opt.text}</span>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Matching Pairs */}
                {q.pairs && (
                  <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1.5">
                    <p className="font-semibold text-slate-400 text-[11px] uppercase tracking-wider mb-2">Kunci Pasangan Menjodohkan:</p>
                    {q.pairs.map((p, pIdx) => (
                      <div key={pIdx} className="flex items-center justify-between p-2 rounded-lg bg-slate-900 border border-slate-800/80">
                        <span className="font-mono text-cyan-300">{p.premise}</span>
                        <span className="text-slate-500 font-bold mx-2">➔</span>
                        <span className="text-emerald-300 font-semibold">{p.correctTarget}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Essay AI Rubric Info */}
                {q.rubric && (
                  <div className="p-3 bg-cyan-950/30 border border-cyan-800/40 rounded-xl text-xs space-y-1">
                    <p className="font-bold text-cyan-300 flex items-center gap-1.5">
                      <Icons.Brain /> Rubrik Evaluasi AI untuk Koreksi Esai:
                    </p>
                    <p className="text-slate-300 text-[11px]">
                      Kata Kunci Wajib: {q.rubric.keywords.map(kw => (
                        <span key={kw} className="inline-block px-1.5 py-0.5 bg-slate-800 text-cyan-300 rounded mx-1 font-mono text-[10px]">
                          {kw}
                        </span>
                      ))}
                    </p>
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* MODAL RIWAYAT REVISI & AUDIT LOG */}
          {showRevisionModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icons.Clock /> Audit Trail & Riwayat Revisi Soal
                  </h3>
                  <button onClick={() => setShowRevisionModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="space-y-3 max-h-96 overflow-y-auto pr-1 text-xs">
                  {revisions.map(rev => (
                    <div key={rev.id} className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
                      <div className="flex justify-between items-center text-slate-400">
                        <span className="font-bold text-cyan-400">{rev.questionId} • {rev.author} ({rev.role})</span>
                        <span className="font-mono text-[11px]">{rev.timestamp}</span>
                      </div>
                      <p className="text-slate-300 font-medium">{rev.summary}</p>
                      <div className="p-2 rounded bg-slate-900 border border-slate-800/80 text-[11px] text-slate-400 font-mono">
                        Snapshot Sebelumnya: "{rev.prevQuestion}"
                      </div>
                      <div className="flex justify-end pt-1">
                        <button
                          onClick={() => handleRollback(rev)}
                          className="px-3 py-1.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded-lg text-xs font-bold transition flex items-center gap-1.5"
                        >
                          <Icons.RefreshCw /> Rollback (Pulihkan Versi Ini)
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL TAMBAH BUTIR SOAL BARU */}
          {showAddQuestionModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icons.Plus /> Tambah Butir Soal Baru ke Bank Soal
                  </h3>
                  <button onClick={() => setShowAddQuestionModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleAddQuestionSubmit} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 font-semibold mb-1">Tipe Soal</label>
                      <select
                        value={newQForm.type}
                        onChange={(e) => setNewQForm({ ...newQForm, type: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                      >
                        <option value="PILIHAN_GANDA">Pilihan Ganda Biasa</option>
                        <option value="PILIHAN_GANDA_KOMPLEKS">Pilihan Ganda Kompleks</option>
                        <option value="BENAR_SALAH">Benar / Salah</option>
                        <option value="ESAI">Esai / Uraian</option>
                        <option value="AUDIO_LISTENING">Audio Listening</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 font-semibold mb-1">Kategori / Mata Pelajaran</label>
                      <input
                        type="text"
                        value={newQForm.category}
                        onChange={(e) => setNewQForm({ ...newQForm, category: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">Teks Pertanyaan / Soal (Mendukung KaTeX LaTeX $$)</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Tuliskan butir soal di sini..."
                      value={newQForm.question}
                      onChange={(e) => setNewQForm({ ...newQForm, question: e.target.value })}
                      className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                    ></textarea>
                  </div>

                  {(newQForm.type === "PILIHAN_GANDA" || newQForm.type === "PILIHAN_GANDA_KOMPLEKS" || newQForm.type === "AUDIO_LISTENING") && (
                    <div className="space-y-2 pt-1 border-t border-slate-800/80">
                      <p className="text-[11px] font-bold text-slate-400">Pilihan Jawaban (Opsi):</p>
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="text"
                          placeholder="Opsi A"
                          value={newQForm.optA}
                          onChange={(e) => setNewQForm({ ...newQForm, optA: e.target.value })}
                          className="px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs"
                        />
                        <input
                          type="text"
                          placeholder="Opsi B"
                          value={newQForm.optB}
                          onChange={(e) => setNewQForm({ ...newQForm, optB: e.target.value })}
                          className="px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs"
                        />
                        <input
                          type="text"
                          placeholder="Opsi C"
                          value={newQForm.optC}
                          onChange={(e) => setNewQForm({ ...newQForm, optC: e.target.value })}
                          className="px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs"
                        />
                        <input
                          type="text"
                          placeholder="Opsi D"
                          value={newQForm.optD}
                          onChange={(e) => setNewQForm({ ...newQForm, optD: e.target.value })}
                          className="px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs"
                        />
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3 pt-1 border-t border-slate-800/80">
                    <div>
                      <label className="block text-slate-400 font-semibold mb-1">Kunci Jawaban Benar</label>
                      <input
                        type="text"

    // =========================================================================
    // MODUL 3: DUCK RACE LIVE (GAMIFIKASI MONITORING REAL-TIME)
    // =========================================================================
    function DuckRaceLiveModule({ students, kkm }) {
      const [simulationActive, setSimulationActive] = useState(false);
      const [simulatedProgress, setSimulatedProgress] = useState({});
      const [selectedDuckStudent, setSelectedDuckStudent] = useState(null);

      // Inisialisasi posisi bebek
      useEffect(() => {
        const initial = {};
        students.forEach(s => {
          initial[s.id] = s.examStatus === "Selesai" ? (s.score || 80) : (s.examStatus === "Sedang Mengerjakan" ? 45 : 5);
        });
        setSimulatedProgress(initial);
      }, [students]);

      // Simulasi Gerak Real-Time
      useEffect(() => {
        if (!simulationActive) return;

        const interval = setInterval(() => {
          setSimulatedProgress(prev => {
            const next = { ...prev };
            students.forEach(s => {
              if (s.examStatus === "Sedang Mengerjakan") {
                const current = next[s.id] || 10;
                if (current < 98) {
                  next[s.id] = Math.min(100, current + Math.floor(Math.random() * 4) + 1);
                }
              }
            });
            return next;
          });
        }, 1200);

        return () => clearInterval(interval);
      }, [simulationActive, students]);

      return (
        <div className="space-y-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
              <div>
                <h3 className="text-base font-bold text-white flex items-center gap-2">
                  <span className="text-yellow-400"><Icons.Duck /></span>
                  Papan Live Monitoring: "Duck Race Live" Siswa
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  Visualisasi balapan bebek interaktif berdasarkan persentase skor dan progres pengerjaan ujian siswa secara real-time.
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setSimulationActive(!simulationActive)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                    simulationActive
                      ? "bg-amber-500 text-slate-950 animate-pulse"
                      : "bg-slate-800 text-slate-300 hover:text-white border border-slate-700"
                  }`}
                >
                  <Icons.RefreshCw />
                  <span>{simulationActive ? "Simulasi Berjalan (Pause)" : "Mulai Simulasi Gerak Live"}</span>
                </button>
              </div>
            </div>

            {/* TRACK BALAPAN SVG INTERAKTIF */}
            <div className="relative bg-[#091122] border-2 border-slate-800 rounded-2xl p-4 overflow-hidden shadow-inner">
              {/* Garis Batas KKM */}
              <div
                className="absolute top-0 bottom-0 z-20 pointer-events-none flex flex-col items-center justify-between"
                style={{ left: `${kkm}%` }}
              >
                <div className="bg-emerald-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-b-md shadow-lg shadow-emerald-500/30">
                  GARIS KKM: {kkm}
                </div>
                <div className="w-0.5 h-full bg-emerald-500/80 border-r border-dashed border-emerald-300"></div>
                <div className="bg-emerald-500 text-slate-950 text-[9px] font-bold px-1.5 rounded-t-md mb-1">
                  LULUS
                </div>
              </div>

              {/* Lintasan Tiap Siswa */}
              <div className="space-y-3 relative z-10 py-2">
                {students.slice(0, 8).map((student, idx) => {
                  const progress = simulatedProgress[student.id] || 0;
                  const isPassed = progress >= kkm;

                  return (
                    <div
                      key={student.id}
                      onClick={() => setSelectedDuckStudent(student)}
                      className="group relative cursor-pointer"
                    >
                      {/* Lane Track Background */}
                      <div className="h-10 bg-slate-950/70 border border-slate-800 rounded-xl relative overflow-hidden flex items-center px-3">
                        <div
                          className={`absolute top-0 bottom-0 left-0 transition-all duration-700 ease-out rounded-xl opacity-20 ${
                            isPassed ? "bg-emerald-500" : "bg-cyan-500"
                          }`}
                          style={{ width: `${progress}%` }}
                        ></div>

                        {/* Nama Siswa & Info */}
                        <div className="flex items-center justify-between w-full text-xs z-10 pointer-events-none">
                          <span className="font-bold text-slate-300 group-hover:text-cyan-300 transition text-[11px]">
                            {idx + 1}. {student.name} ({student.classId})
                          </span>
                          <span className="font-mono font-bold text-[11px] text-cyan-400">
                            {progress}%
                          </span>
                        </div>

                        {/* Bebek SVG yang Berjalan di Atas Lane */}
                        <div
                          className="absolute top-1 bottom-1 transition-all duration-700 ease-out z-20 flex items-center"
                          style={{ left: `calc(${progress}% - 30px)` }}
                        >
                          <div className={`p-1.5 rounded-full shadow-lg transition-transform transform group-hover:scale-125 ${
                            isPassed
                              ? "bg-emerald-500 text-slate-950 shadow-emerald-500/50 duck-animated"
                              : "bg-yellow-400 text-slate-950 shadow-yellow-400/50 duck-animated"
                          }`}>
                            <Icons.Duck />
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* DETAIL MODAL POPUP JIKA BEBEK DIKLIK */}
            {selectedDuckStudent && (
              <div className="p-4 bg-slate-950 border border-cyan-500/40 rounded-xl flex flex-wrap items-center justify-between gap-4 text-xs animate-fadeIn">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-sm">
                    {selectedDuckStudent.name.charAt(0)}
                  </div>
                  <div>
                    <h4 className="font-bold text-white text-sm">{selectedDuckStudent.name}</h4>
                    <p className="text-slate-400 text-[11px]">NISN: {selectedDuckStudent.nisn} • Kelas: {selectedDuckStudent.classId} • Token: {selectedDuckStudent.token}</p>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  <div className="text-center">
                    <span className="text-[10px] text-slate-400 block">Skor Saat Ini:</span>
                    <span className="text-base font-black text-cyan-400">{selectedDuckStudent.score}</span>
                  </div>
                  <div className="text-center">
                    <span className="text-[10px] text-slate-400 block">Pelanggaran:</span>
                    <span className={`text-base font-black ${selectedDuckStudent.violations > 0 ? "text-rose-400" : "text-emerald-400"}`}>
                      {selectedDuckStudent.violations}x
                    </span>
                  </div>
                  <div className="text-center">
                    <span className="text-[10px] text-slate-400 block">Status KKM:</span>
                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                      selectedDuckStudent.score >= kkm ? "bg-emerald-500/20 text-emerald-400" : "bg-rose-500/20 text-rose-400"
                    }`}>
                      {selectedDuckStudent.score >= kkm ? "TUNTAS" : "REMEDIAL"}
                    </span>
                  </div>
                  <button
                    onClick={() => setSelectedDuckStudent(null)}
                    className="px-3 py-1 bg-slate-800 text-slate-300 rounded-lg hover:text-white"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODUL 4: CETAK KARTU BARCODE SISWA
    // =========================================================================
    function BarcodeCardsModule({ students, classes }) {
      const [cardClassFilter, setCardClassFilter] = useState("ALL");

      const filtered = useMemo(() => {
        if (cardClassFilter === "ALL") return students;
        return students.filter(s => s.classId === cardClassFilter);
      }, [students, cardClassFilter]);

      // Render Barcode via JsBarcode
      useEffect(() => {
        if (!window.JsBarcode) return;
        filtered.forEach(s => {
