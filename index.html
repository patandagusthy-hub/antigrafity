    // =========================================================================
    // MODUL 5: ANALISIS BUTIR SOAL AI & REKAP NILAI EXCEL
    // =========================================================================
    function AnalyticsAndGradebookModule({ students, questions, kkm, showToast }) {
      const [strictness, setStrictness] = useState(75);
      const [sandboxInput, setSandboxInput] = useState("Sistem jeda acak mencegah benturan traffic lock dan indexeddb menyimpan data anti lag.");
      const [sandboxScore, setSandboxScore] = useState(null);

      // Hitung Daya Pembeda & Tingkat Kesukaran Empiris
      const analysisData = useMemo(() => {
        return questions.map(q => {
          // Simulasi empiris proporsi benar
          const correctRatio = q.number % 2 === 0 ? 0.78 : (q.number === 1 ? 0.42 : 0.65);
          const diffIndex = correctRatio; // P (Tingkat Kesukaran)
          const discIndex = 0.45; // D (Daya Pembeda)

          let diffLabel = "Sedang";
          if (diffIndex > 0.70) diffLabel = "Mudah";
          else if (diffIndex < 0.30) diffLabel = "Sukar";

          let discLabel = "Sangat Baik";
          if (discIndex < 0.20) discLabel = "Buruk";
          else if (discIndex < 0.30) discLabel = "Cukup";

          return {
            ...q,
            diffIndex: diffIndex.toFixed(2),
            diffLabel,
            discIndex: discIndex.toFixed(2),
            discLabel,
            status: discIndex >= 0.30 ? "DITERIMA" : "REVISI"
          };
        });
      }, [questions]);

      // Sandbox AI Rubric Tuning
      const testAiRubric = () => {
        const keywords = ["jeda acak", "traffic lock", "indexeddb", "anti lag", "lockservice"];
        const lower = sandboxInput.toLowerCase();
        let matches = 0;
        keywords.forEach(kw => {
          if (lower.includes(kw)) matches++;
        });
        const baseScore = (matches / keywords.length) * 100;
        const finalCalculated = Math.round(baseScore * (strictness / 100));
        setSandboxScore(finalCalculated);
        showToast("Simulasi AI Rubric berhasil dikalkulasi!", "success");
      };

      // Unduh Rekap Nilai Siswa Excel (.xlsx)
      const downloadGradebookExcel = () => {
        if (!window.XLSX) return;
        const rows = [
          ["TIMESTAMP", "NISN", "NAMA_SISWA", "KELAS", "SKOR_TOTAL", "STATUS_KKM", "PELANGGARAN", "KETERANGAN"]
        ];
        students.forEach(s => {
          rows.push([
            new Date().toISOString(),
            s.nisn,
            s.name,
            s.classId,
            s.score,
            s.score >= kkm ? "TUNTAS" : "BELUM TUNTAS",
            s.violations,
            s.violations > 0 ? `${s.violations}x terdeteksi` : "Tertib"
          ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rekap_Nilai_CBT");
        XLSX.writeFile(wb, "Rekap_Nilai_GusthyPalinPatandaExam.xlsx");
        showToast("Rekap Nilai Siswa Excel berhasil diunduh!", "success");
      };

      return (
        <div className="space-y-6">
          {/* ANALISIS BUTIR SOAL */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <div>
                <h3 className="text-base font-bold text-white flex items-center gap-2">
                  <Icons.Brain /> Analisis Butir Soal Empiris (Difficulty & Discrimination Index)
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">Kalkulasi statistik mutu instrumen soal berdasarkan respon jawaban siswa.</p>
              </div>
              <button
                onClick={downloadGradebookExcel}
                className="px-3 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-bold flex items-center gap-1.5 transition"
              >
                <Icons.Download /> Unduh Rekap Nilai Siswa (.xlsx)
              </button>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <th className="p-3">No. Soal</th>
                    <th className="p-3">Kategori</th>
                    <th className="p-3 text-center">Tingkat Kesukaran (P)</th>
                    <th className="p-3 text-center">Daya Pembeda (D)</th>
                    <th className="p-3 text-center">Status Rekomendasi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {analysisData.map(item => (
                    <tr key={item.id} className="hover:bg-slate-800/30">
                      <td className="p-3 font-bold text-white">Soal #{item.number}</td>
                      <td className="p-3 text-slate-300">{item.category}</td>
                      <td className="p-3 text-center font-mono">
                        <span className="font-bold text-cyan-400">{item.diffIndex}</span> ({item.diffLabel})
                      </td>
                      <td className="p-3 text-center font-mono">
                        <span className="font-bold text-emerald-400">{item.discIndex}</span> ({item.discLabel})
                      </td>
                      <td className="p-3 text-center">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                          item.status === "DITERIMA" ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" : "bg-amber-500/20 text-amber-300 border border-amber-500/30"
                        }`}>
                          {item.status}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* AI RUBRIC TUNING SANDBOX */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h3 className="text-base font-bold text-white flex items-center gap-2">
              <Icons.Settings /> AI Rubric Tuning Sandbox (Koreksi Esai Otomatis)
            </h3>
            <p className="text-xs text-slate-400">
              Uji coba algoritma penilaian esai berbasis kata kunci dan toleransi semantik dengan pembobotan dinamis.
            </p>

            <div className="space-y-3 text-xs">
              <div>
                <div className="flex justify-between items-center text-slate-300 mb-1">
                  <span>Tingkat Kelonggaran Semantik AI (Strictness):</span>
                  <span className="font-mono font-bold text-cyan-400">{strictness}%</span>
                </div>
                <input
                  type="range"
                  min="30"
                  max="100"
                  value={strictness}
                  onChange={(e) => setStrictness(Number(e.target.value))}
                  className="w-full accent-cyan-500"
                />
              </div>

              <div>
                <label className="block text-slate-400 font-semibold mb-1">Simulasi Jawaban Esai Siswa:</label>
                <textarea
                  rows="3"
                  value={sandboxInput}
                  onChange={(e) => setSandboxInput(e.target.value)}
                  className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-cyan-500"
                ></textarea>
              </div>

              <div className="flex items-center justify-between">
                <button
                  onClick={testAiRubric}
                  className="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold rounded-xl transition"
                >
                  Uji Koreksi AI Sekarang
                </button>
                {sandboxScore !== null && (
                  <div className="text-sm font-bold text-slate-200">
                    Prediksi Skor Esai: <span className="text-emerald-400 text-lg font-black">{sandboxScore} / 100</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StudentExamPortal({
      students, setStudents,
      questions,
      loggedStudent, setLoggedStudent,
      examActive, setExamActive,
      currentQuestionIndex, setCurrentQuestionIndex,
      studentAnswers, setStudentAnswers,
      doubtfulAnswers, setDoubtfulAnswers,
      timeRemaining, setTimeRemaining,
      violations, setViolations,
      audioPlays, setAudioPlays,
      finishExam,
      isSubmitting, submissionCountdown,
      examFinishedData, setExamFinishedData,
      appConfig,
      setShowAdminAuthModal,
      setShowChangePasswordModal,
      setRole,
      setAdminAuthenticated,
      showToast
    }) {
      const [loginMethod, setLoginMethod] = useState("manual"); // 'manual' | 'camera' | 'admin'
      const [inputNisn, setInputNisn] = useState("");
      const [inputToken, setInputToken] = useState("");
      const [adminLoginUser, setAdminLoginUser] = useState("admin");
      const [adminLoginPass, setAdminLoginPass] = useState("");
      const [showLoginPass, setShowLoginPass] = useState(false);
      const [showFinishConfirmModal, setShowFinishConfirmModal] = useState(false);

      // Handle Manual Student Login
      const handleStudentLogin = (e) => {
        e.preventDefault();
        const std = students.find(s => s.nisn === inputNisn.trim() || s.token === inputToken.trim());
        if (!std) {
          showToast("NISN atau Token Ujian tidak ditemukan!", "error");
          return;
        }
        if (std.isLocked) {
          showToast("Akun Anda sedang TERKUNCI! Hubungi pengawas untuk reset login.", "error");
          return;
        }
        setLoggedStudent(std);
        showToast(`Selamat datang, ${std.name}!`, "success");
      };

      // Handle Admin Login dari Halaman Login
      const handleAdminPortalLogin = (e) => {
        e.preventDefault();
        const expectedUser = appConfig?.admin?.username || "admin";
        const expectedPass = appConfig?.admin?.password || "admin123";

        if (adminLoginUser.trim() === expectedUser && adminLoginPass === expectedPass) {
          if (typeof setAdminAuthenticated === "function") setAdminAuthenticated(true);
          if (typeof setRole === "function") setRole("admin");
          showToast("Login Admin Berhasil! Mengalihkan ke Dashboard Pengawas...", "success");
        } else {
          showToast("Username atau Password Admin salah!", "error");
        }
      };

      // Mulai Ujian & Masuk Mode Fullscreen Lock
      const handleStartExam = () => {
        // Enforce Fullscreen API jika diaktifkan di konfigurasi
        if (appConfig.security.enforceFullscreen) {
          const docEl = document.documentElement;
          if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(() => {});
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen().catch(() => {});
          }
        }
        setExamActive(true);
        setTimeRemaining((appConfig.exam.durationMinutes || 60) * 60);
        showToast("Ujian dimulai! Selamat mengerjakan.", "success");
      };

      // Format Waktu MM:SS
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      // Handle Jawaban
      const setAnswer = (qId, val) => {
        setStudentAnswers(prev => ({ ...prev, [qId]: val }));
      };

      const toggleDoubtful = (qId) => {
        setDoubtfulAnswers(prev => ({ ...prev, [qId]: !prev[qId] }));

      // Putar Audio Listening

        const limit = appConfig.exam.audioListeningMaxPlays || maxPlays || 2;
        const currentPlays = audioPlays[qId] || 0;
        if (currentPlays >= limit) {
          showToast("Batas maksimal pemutaran audio telah habis!", "error");

        setAudioPlays(prev => ({ ...prev, [qId]: currentPlays + 1 }));

        sound.play().catch(() => {});

                      value={inputToken}
                      onChange={(e) => setInputToken(e.target.value)}
                      className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-cyan-500 text-sm"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-cyan-500/20 text-sm"
                  >
                    Masuk ke Ujian Siswa
                  </button>

                  <div className="text-center pt-2 border-t border-slate-800/80">
                    <button
                      type="button"
                      onClick={() => setLoginMethod("admin")}
                      className="text-xs text-slate-400 hover:text-cyan-400 transition"
                    >
                      Login sebagai Guru / Pengawas Ruang →
                    </button>
                  </div>
                </form>
              )}

              {loginMethod === "camera" && (
                <div className="text-center space-y-3">
                  <div className="p-8 border-2 border-dashed border-slate-700 rounded-xl bg-slate-950 flex flex-col items-center justify-center">
                    <Icons.Camera />
                    <p className="text-xs text-slate-400 mt-2">Arahkan kartu barcode peserta ke depan kamera perangkat.</p>
                  </div>
                  <button
                    onClick={() => {
                      const sample = students[0];
                      setInputNisn(sample.nisn);
                      setInputToken(sample.token);
                      setLoginMethod("manual");
                      showToast(`Barcode terdeteksi: ${sample.token}`, "success");
                    }}
                    className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold rounded-xl text-xs transition"
                  >
                    Simulasikan Barcode Terpindai (Siswa 1)
                  </button>
                </div>
              )}

              {loginMethod === "admin" && (
                <form onSubmit={handleAdminPortalLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 font-semibold mb-1">Username Pengawas / Admin</label>
                    <input
                      type="text"
                      required
                      value={adminLoginUser}
                      onChange={(e) => setAdminLoginUser(e.target.value)}
                      className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-cyan-500 text-sm"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-slate-400 font-semibold">Password Login Admin</label>
                      <button
                        type="button"
                        onClick={() => setShowChangePasswordModal(true)}
                        className="text-[11px] text-cyan-400 hover:underline flex items-center gap-1"
                      >
                        <Icons.Key /> Ubah Password?
                      </button>
                    </div>
                    <div className="relative">
                      <input
                        type={showLoginPass ? "text" : "password"}
                        required
                        placeholder="Default: admin123"
                        value={adminLoginPass}
                        onChange={(e) => setAdminLoginPass(e.target.value)}
                        className="w-full pl-3 pr-9 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-cyan-500 text-sm"
                      />
                      <button
                        type="button"
                        onClick={() => setShowLoginPass(!showLoginPass)}
                        className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300"
                      >
                        {showLoginPass ? <Icons.EyeOff /> : <Icons.Eye />}
                      </button>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm"
                  >
                    Masuk ke Dashboard Pengawas
                  </button>

                  <div className="text-center pt-2 border-t border-slate-800/80">
                    <button
                      type="button"
                      onClick={() => setShowChangePasswordModal(true)}
                      className="text-xs text-cyan-400 hover:underline inline-flex items-center gap-1 font-medium"
                    >
                      <Icons.Key /> Ubah Kata Sandi Akun Admin
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        );
      }

      // TAMPILAN 3: PRA-UJIAN (KONFIRMASI IDENTITAS & KUNCI LAYAR PENUH)
      if (!examActive) {
        return (
          <div className="max-w-xl mx-auto py-8 space-y-6">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
              <div className="border-b border-slate-800 pb-4">
                <span className="text-[10px] font-bold text-cyan-400 uppercase tracking-widest bg-cyan-500/10 px-2.5 py-1 rounded-full border border-cyan-500/20">
                  Konfirmasi Peserta Ujian
                </span>
                <h3 className="text-xl font-bold text-white mt-2">{appConfig.exam.examTitle || "Ujian Komprehensif Semester 2026"}</h3>
                <p className="text-xs text-slate-400">{appConfig.exam.schoolName || "SMAN 1 Sebatik"} • Sistem GusthyPalinPatandaExam</p>
              </div>

              <div className="grid grid-cols-2 gap-3 text-xs bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                <div>
                  <span className="text-slate-500 block">Nama Peserta:</span>
                  <strong className="text-white text-sm">{loggedStudent.name}</strong>
                </div>
                <div>
                  <span className="text-slate-500 block">NISN:</span>
                  <span className="font-mono text-cyan-400">{loggedStudent.nisn}</span>
                </div>
                <div>
                  <span className="text-slate-500 block">Kelas / Rombel:</span>
                  <span className="text-slate-300">{loggedStudent.classId}</span>
                </div>
                <div>
                  <span className="text-slate-500 block">Alokasi Waktu:</span>
                  <span className="text-emerald-400 font-bold">{appConfig.exam.durationMinutes || 60} Menit</span>
                </div>
              </div>

              <div className="p-4 bg-amber-950/30 border border-amber-500/30 rounded-xl text-xs text-amber-200/90 space-y-2">
                <p className="font-bold flex items-center gap-1.5 text-amber-300">
                  <Icons.AlertTriangle /> Peraturan Keamanan Sistem CBT:
                </p>
                <ul className="list-disc list-inside space-y-1 text-[11px] text-amber-200/80">
                  {appConfig.security.enforceFullscreen && (
                    <li>Layar akan otomatis dikunci dalam <strong>Mode Layar Penuh (Fullscreen)</strong>.</li>
                  )}
                  {appConfig.security.detectTabSwitch && (
                    <li>Dilarang berpindah tab browser atau membuka aplikasi lain.</li>
                  )}
                  {appConfig.security.detectSplitScreen && (
                    <li>Dilarang menggunakan split screen atau jendela mengambang.</li>
                  )}
                  <li>Sistem mencatat setiap pelanggaran. Akun terkunci otomatis pada <strong>{appConfig.security.maxViolations || 4} kali pelanggaran</strong>.</li>
                </ul>
              </div>

              <button
                onClick={handleStartExam}
                className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black rounded-xl transition shadow-xl shadow-emerald-500/20 flex items-center justify-center gap-2 text-sm"
              >
                <Icons.Maximize />
                <span>{appConfig.security.enforceFullscreen ? "MULAI UJIAN & KUNCI LAYAR PENUH" : "MULAI MENGERJAKAN UJIAN SEKARANG"}</span>
              </button>
            </div>
          </div>
        );
      }

      // TAMPILAN 4: LEMBAR UJIAN SISWA (EXAM ENGINE)
      const currentQ = questions[currentQuestionIndex];
      const isDoubt = doubtfulAnswers[currentQ.id];

      return (
        <div className="space-y-4">
          {/* HEADER UJIAN SISWA */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-lg">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-cyan-400">
                #{currentQ.number}
              </div>
              <div>
                <h3 className="font-bold text-white text-sm">{loggedStudent.name}</h3>
                <p className="text-[11px] text-slate-400">{loggedStudent.classId} • NISN: {loggedStudent.nisn}</p>
              </div>
            </div>

            {/* Sisa Waktu & Pelanggaran */}
            <div className="flex items-center gap-3">
              <div className={`px-4 py-2 rounded-xl border flex items-center gap-2 font-mono text-sm font-bold shadow-md ${
                timeRemaining < 300
                  ? "bg-rose-950/80 border-rose-500 text-rose-300 animate-pulse"
                  : "bg-slate-950 border-slate-800 text-cyan-400"
              }`}>
                <Icons.Clock />
                <span>{formatTime(timeRemaining)}</span>
              </div>

              {violations.length > 0 && (
                <div className="px-3 py-2 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 font-bold text-xs flex items-center gap-1.5">
                  <Icons.ShieldAlert />
                  <span>{violations.length} Pelanggaran</span>
                </div>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
            {/* AREA SOAL & LEMBAR KERJA */}
            <div className="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
              <div className="flex justify-between items-center border-b border-slate-800 pb-3 text-xs">
                <span className="px-3 py-1 rounded-full bg-slate-800 text-cyan-400 font-bold border border-slate-700">
                  {currentQ.category}
                </span>
                <span className="text-slate-400">Bobot: <strong className="text-white">{currentQ.points} Poin</strong></span>
              </div>

              {/* Teks Soal dengan KaTeX */}
              <div className="text-base text-slate-100 font-medium leading-relaxed">
                <KatexMath text={currentQ.question} />
              </div>

              {/* Tombol Audio Listening Jika Tersedia */}
              {currentQ.audioUrl && (
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between text-xs">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 rounded-xl bg-amber-500/20 text-amber-400">
                      <Icons.Volume2 />
                    </div>
                    <div>
                      <p className="font-bold text-white">Audio Listening Player</p>
                      <p className="text-slate-400 text-[11px]">Sisa kuota putar: {Math.max(0, (currentQ.audioMaxPlays || 2) - (audioPlays[currentQ.id] || 0))} kali</p>
                    </div>
                  </div>
                  <button
                    onClick={() => playAudioListening(currentQ.id, currentQ.audioMaxPlays)}
                    disabled={(audioPlays[currentQ.id] || 0) >= (currentQ.audioMaxPlays || 2)}
                    className="px-4 py-2 bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-slate-950 font-bold rounded-xl transition"
                  >
                    Putar Audio
                  </button>
                </div>
              )}

              {/* FORM OPSI JAWABAN */}
              <div className="space-y-2 pt-2">
                {/* 1. Pilihan Ganda Biasa */}
                {(currentQ.type === "PILIHAN_GANDA" || currentQ.type === "AUDIO_LISTENING" || currentQ.type === "BENAR_SALAH") && currentQ.options && (
                  currentQ.options.map(opt => {
                    const isSelected = studentAnswers[currentQ.id] === opt.key;
                    return (
                      <div
                        key={opt.key}
                        onClick={() => setAnswer(currentQ.id, opt.key)}
                        className={`p-3.5 rounded-xl border cursor-pointer flex items-start gap-3 transition ${
                          isSelected
                            ? "bg-cyan-950/60 border-cyan-400 text-white shadow-md shadow-cyan-500/10"
                            : "bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-800/40"
                        }`}
                      >
                        <div className={`w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs ${
                          isSelected ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-400"
                        }`}>
                          {opt.key}
                        </div>
                        <span className="flex-1 text-sm mt-0.5">{opt.text}</span>
                      </div>
                    );
                  })
                )}

                {/* 2. Pilihan Ganda Kompleks (Multi Select) */}
                {currentQ.type === "PILIHAN_GANDA_KOMPLEKS" && currentQ.options && (
                  currentQ.options.map(opt => {
                    const currentSelected = Array.isArray(studentAnswers[currentQ.id]) ? studentAnswers[currentQ.id] : [];
                    const isChecked = currentSelected.includes(opt.key);
                    return (
                      <div
                        key={opt.key}
                        onClick={() => {
                          const next = isChecked ? currentSelected.filter(k => k !== opt.key) : [...currentSelected, opt.key];
                          setAnswer(currentQ.id, next);
                        }}
                        className={`p-3.5 rounded-xl border cursor-pointer flex items-start gap-3 transition ${
                          isChecked
                            ? "bg-cyan-950/60 border-cyan-400 text-white shadow-md"
                            : "bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-800/40"
                        }`}
                      >
                        <input
                          type="checkbox"
                          checked={isChecked}
                          readOnly
                          className="mt-1 rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0"
                        />
                        <span className="flex-1 text-sm">{opt.text}</span>
                      </div>
                    );
                  })
                )}

                {/* 3. Menjodohkan */}
                {currentQ.type === "MENJODOHKAN" && currentQ.pairs && (
                  <div className="space-y-3">
                    {currentQ.pairs.map((p, idx) => {
                      const curMap = studentAnswers[currentQ.id] || {};
                      return (
                        <div key={idx} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1 text-xs">
                          <span className="font-semibold text-cyan-300">{idx + 1}. {p.premise}</span>
                          <select
                            value={curMap[idx] || ""}
                            onChange={(e) => {
                              const updated = { ...curMap, [idx]: e.target.value };
                              setAnswer(currentQ.id, updated);
                            }}
                            className="w-full mt-1 p-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-xs"
                          >
                            <option value="">-- Pilih Pasangan Jawaban --</option>
                            {currentQ.pairs.map((pairOpt, optIdx) => (
                              <option key={optIdx} value={pairOpt.correctTarget}>{pairOpt.correctTarget}</option>
                            ))}
                          </select>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* 4. Esai */}
                {currentQ.type === "ESAI" && (
                  <div>
                    <textarea
                      rows="6"
                      placeholder="Tuliskan argumen atau penjelasan lengkap Anda di sini..."
                      value={studentAnswers[currentQ.id] || ""}
                      onChange={(e) => setAnswer(currentQ.id, e.target.value)}
                      className="w-full p-4 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-cyan-500 leading-relaxed"
                    ></textarea>
                    <p className="text-[11px] text-slate-500 mt-1">Jawaban Anda tersimpan otomatis secara real-time ke penyimpanan aman lokal.</p>
                  </div>
                )}
              </div>

              {/* NAVIGASI PREV / NEXT & RAGU-RAGU */}
              <div className="flex flex-wrap items-center justify-between gap-3 border-t border-slate-800 pt-4 text-xs">
                <button
                  onClick={() => setCurrentQuestionIndex(Math.max(0, currentQuestionIndex - 1))}
                  disabled={currentQuestionIndex === 0}
                  className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 font-bold rounded-xl transition"
                >
                  ← Soal Sebelumnya
                </button>

                {appConfig?.exam?.allowDoubtful !== false && (
                  <label className="flex items-center gap-2 px-3 py-2 bg-amber-500/10 border border-amber-500/30 rounded-xl cursor-pointer select-none text-amber-300 font-bold">
                    <input
                      type="checkbox"
                      checked={!!isDoubt}
                      onChange={() => toggleDoubtful(currentQ.id)}
                      className="rounded bg-slate-900 border-amber-500 text-amber-500 focus:ring-0"
                    />
                    <span>Ragu-Ragu</span>
                  </label>
                )}

                {currentQuestionIndex < questions.length - 1 ? (
                  <button
                    onClick={() => setCurrentQuestionIndex(currentQuestionIndex + 1)}
                    className="px-4 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold rounded-xl transition"
                  >
                    Soal Berikutnya →
                  </button>
                ) : (
                  <button
                    onClick={() => setShowFinishConfirmModal(true)}
                    className="px-4 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-black rounded-xl transition shadow-lg shadow-emerald-500/20"
                  >
                    Selesai Ujian & Submit
                  </button>
                )}
              </div>
            </div>

            {/* PALET NOMOR SOAL */}
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4 h-fit">
              <h4 className="font-bold text-white text-xs border-b border-slate-800 pb-2">
                Navigasi Nomor Soal
              </h4>

              <div className="grid grid-cols-4 sm:grid-cols-5 gap-2 text-xs">
                {questions.map((q, idx) => {
                  const hasAnswer = studentAnswers[q.id] !== undefined && studentAnswers[q.id] !== "";
                  const isDoubtNum = doubtfulAnswers[q.id];
                  const isCurrent = currentQuestionIndex === idx;

                  let badgeColor = "bg-slate-950 text-slate-400 border-slate-800"; // Belum dijawab
                  if (hasAnswer) badgeColor = "bg-emerald-500 text-slate-950 font-bold border-emerald-400"; // Terjawab
                  if (isDoubtNum) badgeColor = "bg-amber-400 text-slate-950 font-bold border-amber-300"; // Ragu-ragu

                  return (
                    <button
                      key={q.id}
                      onClick={() => setCurrentQuestionIndex(idx)}
                      className={`h-9 rounded-xl border flex items-center justify-center font-bold transition transform ${badgeColor} ${
                        isCurrent ? "ring-2 ring-cyan-400 scale-105" : ""
                      }`}
                    >
                      {q.number}
                    </button>
                  );
                })}
              </div>

              {/* Keterangan Warna */}
              <div className="space-y-1.5 text-[11px] text-slate-400 border-t border-slate-800 pt-3">
                <div className="flex items-center gap-2">
                  <div className="w-3 h-3 rounded bg-emerald-500"></div>
                  <span>Terjawab</span>
                </div>
                <div className="flex items-center gap-2">
                  <div className="w-3 h-3 rounded bg-amber-400"></div>
                  <span>Ragu-Ragu</span>
                </div>
                <div className="flex items-center gap-2">
                  <div className="w-3 h-3 rounded bg-slate-950 border border-slate-800"></div>
                  <span>Belum Dijawab</span>
                </div>
              </div>

              <button
                onClick={() => setShowFinishConfirmModal(true)}
                className="w-full py-2.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-xl font-bold text-xs transition"
              >
                Kumpulkan Lembar Ujian
              </button>
            </div>
          </div>

          {/* MODAL KONFIRMASI SELESAI UJIAN */}
          {showFinishConfirmModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto">
                  <Icons.CheckCircle />
                </div>
                <div className="text-center">
                  <h3 className="text-base font-bold text-white">Konfirmasi Pengumpulan Ujian</h3>
                  <p className="text-xs text-slate-400 mt-1">
                    Apakah Anda yakin ingin menyelesaikan ujian sekarang?
                  </p>
                </div>

                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-1">
                  <div className="flex justify-between text-slate-300">
                    <span>Soal Terjawab:</span>
                    <strong className="text-emerald-400">{Object.keys(studentAnswers).length} dari {questions.length}</strong>
                  </div>
                  <div className="flex justify-between text-slate-300">
                    <span>Soal Ragu-ragu:</span>
                    <strong className="text-amber-400">{Object.values(doubtfulAnswers).filter(Boolean).length}</strong>
                  </div>
                </div>

                {isSubmitting ? (
                  <div className="p-4 bg-cyan-950/60 border border-cyan-500/40 rounded-xl text-center text-xs space-y-2">
                    <div className="w-6 h-6 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p className="text-cyan-200 font-bold">
                      Menyiapkan Antrean Pengiriman Aman (Random Staggered Delay: {submissionCountdown}s)...
                    </p>
                    <p className="text-[10px] text-slate-400">Mencegah tabrakan server saat ribuan siswa submit bersamaan.</p>
                  </div>
                ) : (
                  <div className="flex gap-2 pt-2">
                    <button
                      onClick={() => setShowFinishConfirmModal(false)}
                      className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition"
                    >
                      Batal, Periksa Lagi
                    </button>
                    <button
                      onClick={() => finishExam(false)}
                      className="flex-1 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-black rounded-xl text-xs transition shadow-lg shadow-emerald-500/20"
                    >
                      Ya, Kumpulkan Sekarang
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount Application ke Root DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
